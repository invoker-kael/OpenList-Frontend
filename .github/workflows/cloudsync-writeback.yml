name: CloudSync Writeback Frontend

on:
  push:
    branches:
      - feature/cloudsync-writeback
    paths:
      - src/pages/manage/webdav-writeback/**
      - src/pages/manage/sidemenu_items.tsx
      - .github/workflows/cloudsync-writeback.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm exec prettier --write src/pages/manage/webdav-writeback/index.tsx src/pages/manage/sidemenu_items.tsx
      - name: TypeScript check
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Build
        run: pnpm build
      - name: Commit formatter output
        run: |
          if git diff --quiet -- src/pages/manage/webdav-writeback/index.tsx src/pages/manage/sidemenu_items.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/manage/webdav-writeback/index.tsx src/pages/manage/sidemenu_items.tsx
          git commit -m "[skip ci] style(manage): format writeback frontend"
          git push
